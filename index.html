<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Covenant Vault — A Bible Escape Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#efe3c8;
    --parchment-deep:#e2d3ab;
    --parchment-shadow:#c9b98a;
    --ink:#1f2a44;
    --ink-soft:#3a4766;
    --gold:#b8862e;
    --gold-bright:#d6a94a;
    --seal-red:#7a2e2e;
    --sage:#5b6e4f;
    --paper-line:rgba(31,42,68,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, #2a3357 0%, #12172b 55%, #0a0d1a 100%);
    min-height:100vh;
    font-family:'EB Garamond', serif;
    color:var(--ink);
    padding:24px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px;margin:0 auto;}

  /* ---------- HEADER / TRAIL ---------- */
  header.top{
    text-align:center;
    margin-bottom:14px;
    position:relative;
  }
  .lang-toggle{
    display:flex; justify-content:center; gap:0; margin-bottom:14px;
  }
  .lang-toggle button{
    font-family:'Courier Prime',monospace;
    font-size:13px; font-weight:700; letter-spacing:1px;
    padding:6px 16px;
    background:rgba(255,255,255,0.06);
    color:#cbd0e6;
    border:1px solid rgba(255,255,255,0.25);
    box-shadow:none;
    cursor:pointer;
  }
  .lang-toggle button:first-child{border-radius:5px 0 0 5px;}
  .lang-toggle button:last-child{border-radius:0 5px 5px 0; border-left:none;}
  .lang-toggle button.active{
    background:var(--gold-bright); color:#221704; border-color:var(--gold-bright);
  }
  header.top h1{
    font-family:'Cinzel',serif;
    font-weight:900;
    color:var(--gold-bright);
    letter-spacing:2px;
    font-size:clamp(28px,5vw,44px);
    margin:0 0 4px;
    text-shadow:0 2px 12px rgba(0,0,0,0.5);
  }
  header.top p.sub{
    color:#cbd0e6;
    font-style:italic;
    margin:0;
    font-size:16px;
    letter-spacing:0.5px;
  }

  .trail{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:22px 0 6px;
  }
  .seal{
    width:52px;height:52px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;font-weight:700;font-size:18px;
    border:3px solid var(--parchment-shadow);
    background:radial-gradient(circle at 35% 30%, #3b466b, #232b48);
    color:#6d76a0;
    position:relative;
    transition:all .4s ease;
  }
  .seal.active{
    border-color:var(--gold-bright);
    background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold));
    color:var(--ink);
    box-shadow:0 0 18px rgba(214,169,74,0.65);
    transform:scale(1.08);
  }
  .seal.done{
    border-color:var(--sage);
    background:radial-gradient(circle at 35% 30%, #7c9468, var(--sage));
    color:#fff;
  }
  .seal.done::after{
    content:"✓";
    position:absolute;
    font-size:20px;
  }
  .seal.done span{display:none;}
  .trail-line{
    align-self:center;
    width:18px;height:2px;
    background:var(--parchment-shadow);
    opacity:0.5;
  }

  /* ---------- CARD (SCROLL) ---------- */
  .card{
    background:
      linear-gradient(var(--paper-line), var(--paper-line)) 0 0/100% 32px,
      var(--parchment);
    border:1px solid var(--parchment-shadow);
    border-radius:6px;
    box-shadow:0 20px 50px rgba(0,0,0,0.45), inset 0 0 60px rgba(184,134,46,0.08);
    padding:34px 30px 30px;
    position:relative;
    animation:riseIn .5s ease;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .card::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid rgba(31,42,68,0.18);
    border-radius:3px;
    pointer-events:none;
  }
  .eyebrow{
    font-family:'Courier Prime',monospace;
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--seal-red);
    margin:0 0 6px;
  }
  .card h2{
    font-family:'Cinzel',serif;
    font-size:clamp(22px,3.6vw,30px);
    margin:0 0 4px;
    color:var(--ink);
  }
  .mission{
    font-style:italic;
    color:var(--ink-soft);
    margin:0 0 18px;
    font-size:17px;
  }
  .situation{
    background:rgba(184,134,46,0.08);
    border-left:3px solid var(--gold);
    padding:12px 16px;
    margin-bottom:20px;
    font-size:16px;
    line-height:1.5;
  }
  .task-list{margin:0 0 20px; padding-left:20px; font-size:16px; line-height:1.6;}

  label{display:block; font-weight:600; margin-bottom:5px; font-size:15px; color:var(--ink);}
  input[type="text"], input[type="number"], select{
    font-family:'EB Garamond',serif;
    font-size:17px;
    padding:9px 12px;
    border:2px solid var(--parchment-shadow);
    border-radius:4px;
    background:#fbf6ea;
    color:var(--ink);
    width:100%;
    max-width:280px;
  }
  input:focus, select:focus, button:focus, .cell:focus, .match-card:focus{
    outline:3px solid var(--gold-bright);
    outline-offset:2px;
  }
  .field-row{display:flex; flex-wrap:wrap; gap:18px; margin-bottom:16px;}
  .field{flex:1; min-width:150px;}

  button{
    font-family:'Cinzel',serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:1px;
    padding:11px 22px;
    background:linear-gradient(var(--gold-bright), var(--gold));
    color:#221704;
    border:none;
    border-radius:4px;
    cursor:pointer;
    box-shadow:0 3px 0 #8a651f, 0 6px 14px rgba(0,0,0,0.25);
    transition:transform .15s ease;
  }
  button:hover{transform:translateY(-1px);}
  button:active{transform:translateY(2px); box-shadow:0 1px 0 #8a651f;}
  button.ghost{
    background:transparent;
    color:var(--ink-soft);
    box-shadow:none;
    border:2px solid var(--parchment-shadow);
  }
  button.tts-btn{
    background:transparent;
    color:var(--ink-soft);
    box-shadow:none;
    border:2px solid var(--sage);
  }
  button.tts-btn.speaking{
    background:var(--sage);
    color:#fff;
  }
  button:disabled{opacity:0.5; cursor:not-allowed; transform:none;}

  .feedback{
    margin-top:14px;
    padding:10px 14px;
    border-radius:4px;
    font-size:15px;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:rgba(91,110,79,0.18); color:#3c4b30; border:1px solid var(--sage);}
  .feedback.bad{background:rgba(122,46,46,0.12); color:var(--seal-red); border:1px solid var(--seal-red);}

  .actions{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; align-items:center;}

  /* hint */
  .hint-box{
    margin-top:14px; font-size:14px; color:var(--ink-soft);
    background:rgba(31,42,68,0.06); border-radius:4px; padding:10px 14px;
    display:none;
  }
  .hint-box.show{display:block;}

  /* ---------- STATION 2 cipher ---------- */
  .cipher-strip{
    font-family:'Courier Prime',monospace;
    font-size:clamp(16px,3vw,22px);
    letter-spacing:2px;
    background:var(--ink);
    color:var(--gold-bright);
    padding:16px 20px;
    border-radius:4px;
    text-align:center;
    margin-bottom:18px;
    overflow-x:auto;
    white-space:nowrap;
  }
  .cipher-key{
    font-family:'Courier Prime',monospace;
    font-size:13px; color:var(--ink-soft); margin-bottom:16px;
  }

  /* ---------- STATION 3 map ---------- */
  .map-wrap{
    background:#0e2233;
    border-radius:6px;
    padding:10px;
    margin-bottom:16px;
    overflow-x:auto;
  }
  .map-wrap svg{display:block; margin:0 auto; max-width:100%; height:auto;}
  .grid-cell{fill:transparent; cursor:pointer; transition:fill .15s ease;}
  .grid-cell:hover{fill:rgba(214,169,74,0.25);}
  .grid-cell.correct{fill:rgba(91,110,79,0.55);}
  .grid-cell.selected-pick{fill:rgba(214,169,74,0.55); stroke:var(--gold-bright); stroke-width:2;}
  .s3-picked{color:var(--sage); font-weight:700; font-size:14px;}
  .map-question{
    background:rgba(184,134,46,0.08);
    border-left:3px solid var(--gold);
    padding:10px 14px;
    margin-bottom:10px;
    font-size:15.5px;
    cursor:pointer;
  }
  .map-question.active{border-left-color:var(--seal-red);}

  /* ---------- STATION 5 matching ---------- */
  .match-cols{display:flex; gap:18px; flex-wrap:wrap;}
  .match-col{flex:1; min-width:220px;}
  .match-col h4{font-family:'Cinzel',serif; font-size:14px; letter-spacing:1px; color:var(--ink-soft); margin:0 0 10px;}
  .match-card{
    display:block; width:100%;
    text-align:left;
    background:#fbf6ea;
    border:2px solid var(--parchment-shadow);
    border-radius:5px;
    padding:12px 14px;
    margin-bottom:10px;
    font-family:'EB Garamond',serif;
    font-size:16px;
    cursor:pointer;
    color:var(--ink);
  }
  .match-card.selected{border-color:var(--gold-bright); background:rgba(214,169,74,0.18);}
  .match-card.paired{border-color:var(--gold-bright); background:rgba(214,169,74,0.28);}
  .match-card.matched{border-color:var(--sage); background:rgba(91,110,79,0.18); cursor:default; opacity:0.85;}

  /* ---------- STATION 6 vault ---------- */
  .vault-door{
    background:linear-gradient(135deg,#2b1c10,#4a3018);
    border:4px solid var(--gold);
    border-radius:10px;
    padding:30px;
    text-align:center;
    margin:18px 0;
    position:relative;
    overflow:hidden;
  }
  .vault-door .ring{
    width:90px;height:90px;border-radius:50%;
    border:6px solid var(--gold-bright);
    margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Courier Prime',monospace;
    font-size:22px;color:var(--gold-bright);
    transition:transform .6s ease;
  }
  .vault-door.open .ring{transform:rotate(160deg); box-shadow:0 0 30px var(--gold-bright);}
  .vault-door p{color:#f1e6c8; margin:6px 0;}

  .final-reveal{
    text-align:center; padding:40px 20px; display:none;
  }
  .final-reveal.show{display:block; animation:riseIn .8s ease;}
  .final-reveal h2{
    font-family:'Cinzel',serif; font-weight:900;
    font-size:clamp(40px,9vw,72px);
    color:var(--gold-bright);
    letter-spacing:4px;
    margin:10px 0;
    text-shadow:0 0 30px rgba(214,169,74,0.7);
  }
  .final-reveal .verse{font-style:italic; color:var(--ink-soft); max-width:480px; margin:14px auto 0; font-size:17px;}

  footer.note{
    text-align:center; color:#8b93b8; font-size:13px; margin-top:26px;
  }

  /* ---------- CODE REVEAL MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(10,13,26,0.75);
    display:flex; align-items:center; justify-content:center;
    z-index:1000;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    padding:20px;
  }
  .modal-overlay.show{opacity:1; pointer-events:all;}
  .modal-box{
    background:var(--parchment);
    border:3px solid var(--gold-bright);
    border-radius:10px;
    padding:36px 34px;
    text-align:center;
    max-width:360px;
    width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    transform:scale(0.92) translateY(10px);
    transition:transform .25s ease;
  }
  .modal-overlay.show .modal-box{transform:scale(1) translateY(0);}
  .modal-eyebrow{
    font-family:'Courier Prime',monospace;
    font-size:12px; letter-spacing:3px; text-transform:uppercase;
    color:var(--seal-red); margin:0 0 6px;
  }
  .modal-box h3{
    font-family:'Cinzel',serif; margin:0 0 16px; font-size:20px; color:var(--ink);
  }
  .modal-box .code-big{
    font-family:'Courier Prime',monospace;
    font-size:44px; font-weight:700;
    color:var(--gold-bright);
    background:var(--ink);
    padding:16px 10px;
    border-radius:6px;
    margin:0 0 16px;
    letter-spacing:3px;
  }
  .modal-note{font-size:14px; color:var(--ink-soft); margin:0 0 20px; font-style:italic;}

  @media (max-width:520px){
    .card{padding:24px 18px;}
    .seal{width:44px;height:44px;font-size:15px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="lang-toggle">
      <button id="lang-en" class="active" type="button">EN</button><button id="lang-fr" type="button">FR</button>
    </div>
    <h1 id="site-title">The Covenant Vault</h1>
    <p class="sub" id="site-subtitle">Trace the family line from Abraham to the Messiah</p>
  </header>

  <nav class="trail" id="trail" aria-label="Station progress"></nav>

  <main id="stationHost"></main>

  <footer class="note" id="site-footer">Six seals. One vault. One name.</footer>
</div>

/* =====================================================================
   STATE
===================================================================== */
const state = {
  lang: 'en',
  current: -1,
  unlocked: [true,false,false,false,false,false],
  codes: {1:null,2:null,3:null,4:null,5:null}
};

function t(){ return I18N[state.lang]; }

function norm(s){
  return (s||"").toString().trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // strip accents for forgiving match
    .replace(/[^a-z0-9]/g,"");
}
function fuzzyMatch(input, answers){
  const a = norm(input);
  if(!a) return false;
  const list = Array.isArray(answers) ? answers : [answers];
  for(const ans of list){
    const b = norm(ans);
    if(a === b) return true;
    if(editDistance(a,b) <= Math.max(1, Math.floor(b.length*0.2))) return true;
  }
  return false;
}
function editDistance(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j]=Math.min(
        dp[i-1][j]+1,
        dp[i][j-1]+1,
        dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
      );
    }
  }
  return dp[m][n];
}

/* =====================================================================
   TEXT-TO-SPEECH (Web Speech API — built into Chrome, offline-capable)
===================================================================== */
function stripHtml(str){
  const d = document.createElement('div');
  d.innerHTML = str;
  return d.textContent || d.innerText || '';
}
let currentUtterance = null;
function makeTtsButton(getTextFn){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tts-btn ghost';
  btn.textContent = t().readAloud;
  if(!('speechSynthesis' in window)){
    btn.disabled = true;
    btn.title = 'Text-to-speech not supported in this browser';
    return btn;
  }
  btn.addEventListener('click', ()=>{
    if(window.speechSynthesis.speaking){
      window.speechSynthesis.cancel();
      btn.textContent = t().readAloud;
      btn.classList.remove('speaking');
      return;
    }
    const text = stripHtml(getTextFn());
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = state.lang === 'fr' ? 'fr-CA' : 'en-US';
    utter.rate = 0.92;
    utter.onend = ()=>{ btn.textContent = t().readAloud; btn.classList.remove('speaking'); };
    utter.onerror = ()=>{ btn.textContent = t().readAloud; btn.classList.remove('speaking'); };
    currentUtterance = utter;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
    btn.textContent = t().stopReading;
    btn.classList.add('speaking');
  });
  return btn;
}

/* =====================================================================
   TRAIL
===================================================================== */
function renderTrail(){
  const trail = document.getElementById('trail');
  trail.innerHTML = "";
  for(let i=0;i<6;i++){
    if(i>0){
      const line = document.createElement('div');
      line.className='trail-line';
      trail.appendChild(line);
    }
    const seal = document.createElement('div');
    seal.className = 'seal' + (state.unlocked[i] && i < state.current ? ' done' : '') + (i===state.current ? ' active' : '');
    seal.innerHTML = `<span>${i+1}</span>`;
    seal.title = t().stationTitles[i];
    trail.appendChild(seal);
  }
}

function refreshChrome(){
  document.getElementById('site-title').textContent = t().siteTitle;
  document.getElementById('site-subtitle').textContent = t().siteSubtitle;
  document.getElementById('site-footer').textContent = t().siteFooter;
  document.getElementById('lang-en').classList.toggle('active', state.lang==='en');
  document.getElementById('lang-fr').classList.toggle('active', state.lang==='fr');
  renderTrail();
}

document.getElementById('lang-en').addEventListener('click', ()=>{ state.lang='en'; refreshChrome(); rerenderCurrent(); });
document.getElementById('lang-fr').addEventListener('click', ()=>{ state.lang='fr'; refreshChrome(); rerenderCurrent(); });

function rerenderCurrent(){
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  if(state.current === -1){ renderIntro(); } else { goTo(state.current); }
}

/* =====================================================================
   ROUTER
===================================================================== */
function goTo(stationIndex){
  state.current = stationIndex;
  state.unlocked[stationIndex] = true;
  refreshChrome();
  const host = document.getElementById('stationHost');
  host.innerHTML = "";
  const renderers = [renderStation1, renderStation2, renderStation3, renderStation4, renderStation5, renderStation6];
  renderers[stationIndex](host);
  window.scrollTo({top:0, behavior:'smooth'});
}

function unlockNext(fromIndex, codeNum, codeVal){
  state.unlocked[fromIndex+1] = true;
  showCodeModal(codeNum, codeVal, ()=>goTo(fromIndex+1));
}

function showCodeModal(codeNum, codeVal, onContinue){
  const overlay = el(`
    <div class="modal-overlay" id="code-modal">
      <div class="modal-box">
        <p class="modal-eyebrow">${t().sealBroken}</p>
        <h3>${t().codeUnlocked(codeNum)}</h3>
        <div class="code-big">${codeVal}</div>
        <p class="modal-note">${t().writeDown}</p>
        <button id="modal-continue">${t().continueArrow}</button>
      </div>
    </div>`);
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>overlay.classList.add('show'));
  const btn = overlay.querySelector('#modal-continue');
  const close = ()=>{
    overlay.classList.remove('show');
    setTimeout(()=>{ overlay.remove(); onContinue(); }, 250);
  };
  btn.addEventListener('click', close);
  btn.focus();
}

        <input type="number" id="s1-ch1" placeholder="${T.chapterPH}">
      </div>
      <div class="field">
        <label for="s1-ch2">${T.ch2Label}</label>
        <input type="number" id="s1-ch2" placeholder="${T.chapterPH}">
      </div>
    </div>

    <div class="actions">
      <button id="s1-check">${T.verifyBtn}</button>
      <button class="ghost" id="s1-hint" type="button">${t().needHint}</button>
    </div>
    <div class="hint-box" id="s1-hintbox">${T.hint}</div>
    <div class="feedback" id="s1-fb"></div>
  </div>`);
  host.appendChild(card);

  const ttsBtn = makeTtsButton(()=> `${T.title}. ${T.mission} ${T.situation}`);
  card.querySelector('.actions').appendChild(ttsBtn);

  card.querySelector('#s1-hint').addEventListener('click', ()=>{
    card.querySelector('#s1-hintbox').classList.toggle('show');
  });

  card.querySelector('#s1-check').addEventListener('click', ()=>{
    const m1 = card.querySelector('#s1-mother1').value;
    const s1v = card.querySelector('#s1-son1').value;
    const m2 = card.querySelector('#s1-mother2').value;
    const s2v = card.querySelector('#s1-son2').value;
    const c1 = parseInt(card.querySelector('#s1-ch1').value,10);
    const c2 = parseInt(card.querySelector('#s1-ch2').value,10);
    const fb = card.querySelector('#s1-fb');

    const namesOk =
      fuzzyMatch(m1,['Hagar','Agar']) && fuzzyMatch(s1v,['Ishmael','Ismael','Ismaël']) &&
      fuzzyMatch(m2,['Sarah','Sarai','Sara']) && fuzzyMatch(s2v,['Isaac']);
    const chaptersOk = (c1===16 && c2===21) || (c1===21 && c2===16);

    if(namesOk && chaptersOk){
      const code = c1 + c2;
      state.codes[1] = code;
      showFeedback(fb, true, T.correctMsg(c1,c2,code));
      card.querySelector('#s1-check').disabled = true;
      unlockNext(0, 1, code);
    } else if(!namesOk){
      showFeedback(fb, false, T.namesWrongMsg);
    } else {
      showFeedback(fb, false, T.chaptersWrongMsg);
    }
  });
}

function renderStation2(host){

    <div class="field-row">
      <div class="field">
        <label for="s2-object">${T.objectLabel}</label>
        <input type="text" id="s2-object" placeholder="${T.objectPH}">
      </div>
    </div>

    <div class="actions">
      <button id="s2-check">${T.unlockBtn}</button>
      <button class="ghost" id="s2-hint" type="button">${t().needHint}</button>
    </div>
    <div class="hint-box" id="s2-hintbox">${T.hint}</div>
    <div class="feedback" id="s2-fb"></div>
  </div>`);
  host.appendChild(card);

  const ttsBtn = makeTtsButton(()=> `${T.title}. ${T.mission} ${T.situation}`);
  card.querySelector('.actions').appendChild(ttsBtn);

  card.querySelector('#s2-hint').addEventListener('click', ()=>{
    card.querySelector('#s2-hintbox').classList.toggle('show');
  });

  card.querySelector('#s2-check').addEventListener('click', ()=>{
    const obj = card.querySelector('#s2-object').value;
    const fb = card.querySelector('#s2-fb');
    if(fuzzyMatch(obj, ['robe','coat','tunique','manteau'])){
      state.codes[2] = 4;
      showFeedback(fb, true, T.correctMsg);
      card.querySelector('#s2-check').disabled = true;
      unlockNext(1, 2, 4);
    } else {
      showFeedback(fb, false, T.wrongMsg);
    }
  });
}

    x:0, y:0, width:IMG_W, height:IMG_H,
    preserveAspectRatio:'xMidYMid meet'
  }));

  const fb = card.querySelector('#s3-fb');
  const submitBtn = card.querySelector('#s3-submit');
  let activeQ = 0;
  const selections = [null, null, null];
  const cellsGroup = mk('g',{});
  const allRects = [];
  for(let c=0;c<COLS.length;c++){
    for(let r=1;r<=ROWS;r++){
      const rect = mk('rect',{
        x:x0+c*cw, y:y0+(r-1)*ch, width:cw, height:ch,
        class:'grid-cell', tabindex:'0', role:'button',
        'aria-label':`${COLS[c]}${r}`
      });
      rect.addEventListener('click', ()=>handleCellClick(c,r,rect));
      rect.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); handleCellClick(c,r,rect);} });
      cellsGroup.appendChild(rect);
      allRects.push(rect);
    }
  }
  svg.appendChild(cellsGroup);

  function updateQuestionUI(){
    for(let i=0;i<3;i++){
      const qEl = card.querySelector(`#s3-q${i}`);
      qEl.classList.toggle('active', i===activeQ);
      const pickedEl = card.querySelector(`#s3-picked${i}`);
      pickedEl.textContent = selections[i] ? T.selectedSuffix(`${COLS[selections[i].c]}${selections[i].r}`) : '';
    }
    submitBtn.disabled = !(selections[0] && selections[1] && selections[2]);
  }

  function handleCellClick(c,r,rectEl){
    if(selections[activeQ]) selections[activeQ].rect.classList.remove('selected-pick');
    selections[activeQ] = {c,r,rect:rectEl};
    rectEl.classList.add('selected-pick');
    if(activeQ < 2) activeQ++;
    updateQuestionUI();
  }

  T.questions.forEach((_,i)=>{
    card.querySelector(`#s3-q${i}`).addEventListener('click', ()=>{
      activeQ = i;
      updateQuestionUI();
    });
  });

  function resetAll(){
    selections.forEach(s=>{ if(s) s.rect.classList.remove('selected-pick'); });
    selections[0]=selections[1]=selections[2]=null;
    activeQ = 0;
    updateQuestionUI();
  }

  submitBtn.addEventListener('click', ()=>{
    const allCorrect = landmarks.every((lm,i)=> selections[i].c===lm.col && selections[i].r===lm.row);
    if(allCorrect){
      const code = landmarks.reduce((sum,lm)=>sum+lm.row,0);
      state.codes[3] = code;
      allRects.forEach(r=>r.classList.remove('selected-pick'));
      selections.forEach((s,i)=>{ const cell = document.querySelector(`#s3-svg rect[aria-label="${COLS[landmarks[i].col]}${landmarks[i].row}"]`); if(cell) cell.classList.add('correct'); });
      showFeedback(fb, true, T.correctMsg(landmarks.map(l=>l.row), code));
      submitBtn.disabled = true;
      unlockNext(2, 3, code);
    } else {
      showFeedback(fb, false, T.wrongMsg);
      resetAll();
    }
  });

  updateQuestionUI();
}

/* =====================================================================
   STATION 4 — DAVID
===================================================================== */
function renderStation4(host){
  const T = t().s4;
  const scrollHtml = [
    T.scroll[0].replace('__A__', '<input type="text" id="s4-a" style="width:150px;display:inline-block;">'),
    T.scroll[1].replace('__B__', '<input type="text" id="s4-b" style="width:150px;display:inline-block;">'),
    T.scroll[2].replace('__C__', '<input type="text" id="s4-c" style="width:100px;display:inline-block;">'),
    T.scroll[3].replace('__D__', '<input type="text" id="s4-d" style="width:150px;display:inline-block;">')
  ].join('<br>');

  const card = el(`
  <div class="card">
    <p class="eyebrow">${T.eyebrow}</p>
    <h2>${T.title}</h2>
    <p class="mission">${T.mission}</p>
    <div class="situation">${T.situation}</div>

    <div class="task-list" style="font-style:italic; line-height:2;">${scrollHtml}</div>

    <div class="actions">
      <button id="s4-check">${T.repairBtn}</button>
      <button class="ghost" id="s4-hint" type="button">${t().needHint}</button>
    </div>
    <div class="hint-box" id="s4-hintbox">${T.hint}</div>
    <div class="feedback" id="s4-fb"></div>
  </div>`);
  host.appendChild(card);

  const ttsBtn = makeTtsButton(()=> `${T.title}. ${T.mission} ${T.situation}`);
  card.querySelector('.actions').appendChild(ttsBtn);

  card.querySelector('#s4-hint').addEventListener('click', ()=>{
    card.querySelector('#s4-hintbox').classList.toggle('show');
  });

  card.querySelector('#s4-check').addEventListener('click', ()=>{
    const a = card.querySelector('#s4-a').value;
    const b = card.querySelector('#s4-b').value;
    const c = card.querySelector('#s4-c').value;
    const d = card.querySelector('#s4-d').value;
    const fb = card.querySelector('#s4-fb');

    const aOk = fuzzyMatch(a,['Bethlehem','Bethleem','Bethléem']);
    const bOk = fuzzyMatch(b,['heart','coeur']);
    const cOk = fuzzyMatch(c,['seven','7','sept']);
    const dOk = fuzzyMatch(d,['spirit','esprit']);

    if(aOk && bOk && cOk && dOk){
      state.codes[4] = 7;
      showFeedback(fb, true, T.correctMsg);
      card.querySelector('#s4-check').disabled = true;
      unlockNext(3, 4, 7);
    } else {
      showFeedback(fb, false, T.wrongMsg);
    }
  });
}

/* =====================================================================
   STATION 5 — PROPHECY MATCH
===================================================================== */
function renderStation5(host){
  const T = t().s5;
  const otCards = [
    {id:'ot1', ref:'Micah 5:2', text:T.otTexts[0], chapter:5},
    {id:'ot2', ref:'Isaiah 7:14', text:T.otTexts[1], chapter:7},
    {id:'ot3', ref:'Isaiah 9:6', text:T.otTexts[2], chapter:9},
  ];
  // NT text intentionally withheld - students must open their own Bible to the reference
  const ntCards = [
    {id:'nt1', match:'ot1', ref:'Matthew 2:1'},
    {id:'nt2', match:'ot2', ref:'Matthew 1:23'},
    {id:'nt3', match:'ot3', ref:'Luke 1:32'},
  ];
  const shuffledNt = [...ntCards].sort(()=>Math.random()-0.5);

  const card = el(`
  <div class="card">
    <p class="eyebrow">${T.eyebrow}</p>
    <h2>${T.title}</h2>
    <p class="mission">${T.mission}</p>
    <div class="situation">${T.situation}</div>
    <div class="match-cols">
      <div class="match-col">
        <h4>${T.otHeader}</h4>
        <div id="s5-ot"></div>
      </div>
      <div class="match-col">
        <h4>${T.ntHeader}</h4>
        <div id="s5-nt"></div>
      </div>
    </div>
    <div class="actions">
      <button id="s5-submit" disabled>${T.submitBtn}</button>
      <button class="ghost" id="s5-hint" type="button">${t().needHint}</button>
    </div>
    <div class="hint-box" id="s5-hintbox">${T.hint}</div>
    <div class="feedback" id="s5-fb"></div>
  </div>`);
  host.appendChild(card);

  const ttsBtn = makeTtsButton(()=> `${T.title}. ${T.mission} ${T.situation} ${otCards.map(c=>c.ref+'. '+c.text).join(' ')}`);
  card.querySelector('.actions').appendChild(ttsBtn);

  card.querySelector('#s5-hint').addEventListener('click', ()=>{
    card.querySelector('#s5-hintbox').classList.toggle('show');
  });

  const otHost = card.querySelector('#s5-ot');
  const ntHost = card.querySelector('#s5-nt');
  otCards.forEach(c=>{
    const b = el(`<button type="button" class="match-card" data-id="${c.id}" data-chapter="${c.chapter}"><strong>${c.ref}</strong><br><span style="font-size:14px;">${c.text}</span></button>`);
    otHost.appendChild(b);
  });
  shuffledNt.forEach(c=>{
    const b = el(`<button type="button" class="match-card" data-id="${c.id}" data-match="${c.match}"><strong>${c.ref}</strong></button>`);
    ntHost.appendChild(b);
  });

  let selectedOt = null;
  const fb = card.querySelector('#s5-fb');
  const submitBtn = card.querySelector('#s5-submit');
  const pairs = {};

  function updateSubmitState(){
    submitBtn.disabled = Object.keys(pairs).length < otCards.length;
  }

  otHost.querySelectorAll('.match-card').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.classList.contains('paired')) return;
      otHost.querySelectorAll('.match-card').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      selectedOt = b;
    });
  });

  ntHost.querySelectorAll('.match-card').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.classList.contains('paired')){
        const otId = Object.keys(pairs).find(k=>pairs[k]===b);
        if(otId){
          delete pairs[otId];
          b.classList.remove('paired');
          const otBtn = otHost.querySelector(`[data-id="${otId}"]`);
          if(otBtn) otBtn.classList.remove('paired');
          updateSubmitState();
        }
        return;
      }
      if(!selectedOt){
        showFeedback(fb, false, T.selectFirstMsg);
        return;
      }
      const otId = selectedOt.dataset.id;
      if(pairs[otId]){
        pairs[otId].classList.remove('paired');
      }
      pairs[otId] = b;
      selectedOt.classList.remove('selected');
      selectedOt.classList.add('paired');
      b.classList.add('paired');
      selectedOt = null;
      updateSubmitState();
    });
  });

  function resetAll(){
    otHost.querySelectorAll('.match-card').forEach(x=>x.classList.remove('selected','paired'));
    ntHost.querySelectorAll('.match-card').forEach(x=>x.classList.remove('selected','paired'));
    Object.keys(pairs).forEach(k=>delete pairs[k]);
    selectedOt = null;
    updateSubmitState();
  }

  submitBtn.addEventListener('click', ()=>{
    const allCorrect = otCards.every(c => pairs[c.id] && pairs[c.id].dataset.match === c.id);
    if(allCorrect){
      otHost.querySelectorAll('.match-card').forEach(x=>x.classList.add('matched'));
      ntHost.querySelectorAll('.match-card').forEach(x=>x.classList.add('matched'));
      const code = otCards.reduce((sum,c)=>sum+c.chapter,0);
      state.codes[5] = code;
      showFeedback(fb, true, T.correctMsg(code));
      submitBtn.disabled = true;
      unlockNext(4, 5, code);
    } else {
      showFeedback(fb, false, T.wrongMsg);
      resetAll();
    }
  });
}

/* =====================================================================
   STATION 6 — FULFILLMENT VAULT
===================================================================== */
function renderStation6(host){
  const T = t().s6;
  const card = el(`
  <div class="card" id="s6-main">
    <p class="eyebrow">${T.eyebrow}</p>
    <h2>${T.title}</h2>
    <p class="mission">${T.mission}</p>
    <div class="situation">${T.situation}</div>

    <div class="field-row" id="s6-codes"></div>

    <div class="field-row">
      <div class="field">
        <label for="s6-gen">${T.genLabel}</label>
        <input type="number" id="s6-gen" placeholder="?">
      </div>
      <div class="field">
        <label for="s6-final">${T.finalLabel}</label>
        <input type="number" id="s6-final" placeholder="?">
      </div>
    </div>

    <div class="actions">
      <button id="s6-unlock">${T.unlockBtn}</button>
      <button class="ghost" id="s6-hint" type="button">${t().needHint}</button>
    </div>
    <div class="hint-box" id="s6-hintbox">${T.hint}</div>
    <div class="feedback" id="s6-fb"></div>

    <div class="vault-door" id="s6-door">
      <div class="ring">\ud83d\udd12</div>
      <p>${T.doorWaiting}</p>
    </div>

    <div id="s6-clue-block" style="display:none;">
      <div class="situation">${T.clueSituation}</div>
      <div class="field-row">
        <div class="field">
          <label for="s6-name">${T.nameLabel}</label>
          <input type="text" id="s6-name" placeholder="${T.namePH}">
        </div>
      </div>
      <div class="actions">
        <button id="s6-reveal">${T.revealBtn}</button>
      </div>
      <div class="feedback" id="s6-fb2"></div>
    </div>
  </div>
  `);
  const finalReveal = el(`
  <div class="final-reveal" id="s6-final-reveal">
    <p class="eyebrow" style="text-align:center;">${T.finalEyebrow}</p>
    <h2>${T.finalWord}</h2>
    <p class="verse">${T.finalVerse}</p>
  </div>
  `);
  host.appendChild(card);
  host.appendChild(finalReveal);

  const ttsBtn = makeTtsButton(()=> `${T.title}. ${T.mission} ${T.situation}`);
  card.querySelector('.actions').appendChild(ttsBtn);

  // students enter their own codes from what they wrote down at each station -
  // this checks their transcription against the codes actually unlocked
  const codesHost = card.querySelector('#s6-codes');
  for(let i=1;i<=5;i++){
    codesHost.appendChild(el(`
      <div class="field">
        <label for="s6-code${i}">${T.codeLabel(i)}</label>
        <input type="number" id="s6-code${i}" placeholder="?">
      </div>`));
  }

  card.querySelector('#s6-hint').addEventListener('click', ()=>{
    card.querySelector('#s6-hintbox').classList.toggle('show');
  });

  card.querySelector('#s6-unlock').addEventListener('click', ()=>{
    const fb = card.querySelector('#s6-fb');

    let enteredSum = 0;
    let allCodesMatch = true;
    for(let i=1;i<=5;i++){
      const inputEl = card.querySelector(`#s6-code${i}`);
      const val = parseInt(inputEl.value,10);
      const correct = val === state.codes[i];
      inputEl.style.borderColor = correct ? 'var(--sage)' : 'var(--seal-red)';
      if(!correct) allCodesMatch = false;
      if(!isNaN(val)) enteredSum += val;
    }
    if(!allCodesMatch){
      showFeedback(fb, false, T.codeMismatchMsg);
      return;
    }

    const gen = parseInt(card.querySelector('#s6-gen').value,10);
    const finalInput = parseInt(card.querySelector('#s6-final').value,10);

    if(gen !== 14){
      showFeedback(fb, false, T.genWrongMsg);
      return;
    }
    const expectedFinal = enteredSum - 14;
    if(finalInput === expectedFinal){
      showFeedback(fb, true, T.tumblersMsg(enteredSum, expectedFinal));
      card.querySelector('#s6-door').classList.add('open');
      card.querySelector('#s6-door').querySelector('p').textContent = T.doorOpen;
      card.querySelector('#s6-unlock').disabled = true;
      setTimeout(()=>{
        card.querySelector('#s6-clue-block').style.display = 'block';
      }, 700);
    } else {
      showFeedback(fb, false, T.finalWrongMsg);
    }
  });

  card.querySelector('#s6-reveal').addEventListener('click', ()=>{
    const name = card.querySelector('#s6-name').value;
    const fb2 = card.querySelector('#s6-fb2');
    if(fuzzyMatch(name, ['Jesus','Jésus','Jesús'])){
      showFeedback(fb2, true, T.yesMsg);
      card.querySelector('#s6-reveal').disabled = true;
      setTimeout(()=>{
        card.style.display = 'none';
        finalReveal.classList.add('show');
        state.unlocked[5] = true;
        renderTrail();
        document.querySelectorAll('.seal')[5]?.classList.add('done');
      }, 500);
    } else {
      showFeedback(fb2, false, T.nameWrongMsg);
    }
  });
}

/* =====================================================================
   INIT
===================================================================== */
state.current = -1;
renderIntro();
</script>
